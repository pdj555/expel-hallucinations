[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expel-hallucinations"
version = "0.1.0"
description = "Three-state output enforcement + calibration eval for Claude. Hallucination as calibration failure."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.100.0",
    "numpy>=2.0",
    "matplotlib>=3.8",
]

[tool.setuptools]
py-modules = ["wrapper", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["wrapper.py"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "anthropic.*"]
ignore_missing_imports = true
